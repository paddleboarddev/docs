name: Deploy docs to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory=/usr/local/bin
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: mdbook build
      - name: Add canonical links
        # mdBook writes index.html as a byte-for-byte copy of the first chapter
        # (introduction.html) and sets no canonical anywhere, so Google sees two
        # identical pages and flags one "Duplicate without user-selected
        # canonical". Give every indexable page a canonical: the site root for
        # the copy of index.html, itself for everything else. Pages that already
        # carry one (mdBook's redirect stubs) and noindex pages are left alone.
        run: |
          BASE="https://docs.paddleboard.dev"
          # Compare against a copy taken first: index.html itself gets edited in
          # the loop, after which nothing would match it.
          root_copy="$(mktemp)"
          cp book/index.html "$root_copy"
          find book -type f -name '*.html' ! -name '404.html' \
            | while IFS= read -r path; do
                grep -q -i '<meta name="robots" content="noindex"' "$path" && continue
                grep -q -i '<link rel="canonical"' "$path" && continue
                f="${path#book/}"
                loc="$BASE/$f"; loc="${loc%index.html}"
                if [ "$path" != book/index.html ] && cmp -s "$path" "$root_copy"; then
                  loc="$BASE/"
                fi
                CANONICAL="$loc" perl -0pi -e 's#</head>#    <link rel="canonical" href="$ENV{CANONICAL}">\n    </head>#' "$path"
              done
      - name: Generate sitemap.xml and robots.txt
        # mdBook emits neither. Build a sitemap from the generated HTML (so it
        # always covers every page) and a robots.txt that points crawlers at it.
        # Pages that mark themselves noindex (mdBook's print.html and toc.html,
        # and any helper page a later mdBook adds) are left out, so the sitemap
        # never asks Google to index a page that tells it not to. So are pages
        # whose canonical is another URL (the introduction.html copy of the
        # root, and redirect stubs), so the sitemap lists each page once.
        run: |
          BASE="https://docs.paddleboard.dev"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            find book -type f -name '*.html' ! -name '404.html' \
              | sort \
              | while IFS= read -r path; do
                  grep -q -i '<meta name="robots" content="noindex"' "$path" && continue
                  f="${path#book/}"
                  loc="$BASE/$f"; loc="${loc%index.html}"
                  grep -q -i "<link rel=\"canonical\" href=\"${loc}\">" "$path" || continue
                  echo "  <url><loc>${loc}</loc></url>"
                done
            echo '</urlset>'
          } > book/sitemap.xml
          printf 'User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n' "$BASE" > book/robots.txt
          echo "Generated sitemap with $(grep -c '<url>' book/sitemap.xml) URLs"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
