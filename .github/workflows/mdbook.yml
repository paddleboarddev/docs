name: Deploy docs to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory=/usr/local/bin
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: mdbook build
      - name: Generate sitemap.xml and robots.txt
        # mdBook emits neither. Build a sitemap from the generated HTML (so it
        # always covers every page) and a robots.txt that points crawlers at it.
        run: |
          BASE="https://docs.paddleboard.dev"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            find book -type f -name '*.html' ! -name '404.html' ! -name 'print.html' \
              | sed 's|^book/||' | sort \
              | while IFS= read -r f; do
                  loc="$BASE/$f"; loc="${loc%index.html}"
                  echo "  <url><loc>${loc}</loc></url>"
                done
            echo '</urlset>'
          } > book/sitemap.xml
          printf 'User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n' "$BASE" > book/robots.txt
          echo "Generated sitemap with $(grep -c '<url>' book/sitemap.xml) URLs"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
