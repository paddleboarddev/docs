[book]
authors = ["paddleboarddev"]
language = "en"
src = "src"
title = "PaddleBoard Docs"
description = "Documentation for PaddleBoard — the open-source AI IDE and coding-agent harness. Guides for getting started, bring-your-own-key LLM providers, the AI Dock, agents, sandboxing, and more."

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/paddleboarddev/paddleboard"
edit-url-template = "https://github.com/paddleboarddev/docs/edit/main/{path}"
no-section-label = false

[output.html.search]
enable = true
